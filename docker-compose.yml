name: mcp-gateway

# Host ports. Defaults are the quickstart ports. Override any of them when
# that port is already taken; the process inside the container does not move.
#   GATEWAY_PORT=18080 docker compose up
services:
  echo-server:
    build:
      context: .
      dockerfile: examples/echo-server/Dockerfile
    ports:
      - "${ECHO_PORT:-8081}:8081"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: echo-server
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"

  gateway:
    build:
      context: .
      dockerfile: cmd/mcp-gateway/Dockerfile
    command:
      - -listen
      - :8080
      - -upstream
      - http://echo-server:8081/mcp
      - -config
      - /etc/mcp-gateway/gateway.yaml
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./examples/config/gateway.yaml:/etc/mcp-gateway/gateway.yaml:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: mcp-gateway
    depends_on:
      - echo-server
      - jaeger
