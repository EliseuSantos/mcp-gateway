name: mcp-gateway

services:
  echo-server:
    build:
      context: .
      dockerfile: examples/echo-server/Dockerfile
    ports:
      - "8081:8081"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: echo-server
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  gateway:
    build:
      context: .
      dockerfile: cmd/mcp-gateway/Dockerfile
    command:
      - -listen
      - :8080
      - -upstream
      - http://echo-server:8081/mcp
      - -config
      - /etc/mcp-gateway/gateway.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./examples/config/gateway.yaml:/etc/mcp-gateway/gateway.yaml:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: mcp-gateway
    depends_on:
      - echo-server
      - jaeger
