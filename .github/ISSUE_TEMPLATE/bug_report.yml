name: Bug report
description: Something in the gateway does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, do not use this form: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, config (redact secrets) and requests that trigger the problem.
      placeholder: |
        1. docker compose up --build
        2. curl ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant gateway logs or audit lines, with secrets removed.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Go version, Docker or binary, MCP client
